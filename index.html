<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>レビュー在庫箱 🦀</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#263342;background:#f5f5f0}*{box-sizing:border-box}
body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#fffdf8ee;backdrop-filter:blur(10px);border-bottom:1px solid #ddd;z-index:5;padding:12px max(14px,3vw)}
h1{font-size:1.2rem;margin:0 0 9px}.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:160px}input,select,textarea{border:1px solid #cbd2d4;border-radius:8px;padding:9px;background:white;min-width:0}
button{border:1px solid #cbd2d4;border-radius:9px;background:white;padding:8px 11px;color:#273645}button.primary{background:#256c76;color:white;border-color:#256c76}button.danger{color:#a52b35}.muted{color:#6c7781;font-size:.83rem}
main{padding:16px max(14px,3vw)}#cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid #dce2df;border-radius:12px;overflow:hidden;min-width:0;cursor:pointer;position:relative}.card.closed{opacity:.48}.pic{aspect-ratio:1.38;background:#e6ece9;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:8px}.name{font-weight:700;font-size:.87rem;line-height:1.4;height:2.8em;overflow:hidden;overflow-wrap:anywhere}.meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;align-items:center}.pill{border-radius:5px;background:#e4ecec;padding:3px 5px;font-size:.69rem}.card[data-status="投稿待ち"]{border-color:#5e9a8b}.card[data-status="保留"]{border-color:#c99a48}.card[data-status="レビュー待ち"]{border-color:#83a9cf}.card[data-status="確認待ち"]{border-color:#b3a3cc}
body[data-density="medium"] #cards{grid-template-columns:repeat(6,minmax(0,1fr))}
body[data-density="small"] #cards{grid-template-columns:repeat(8,minmax(0,1fr))}
body[data-density="small"] .pic{aspect-ratio:1.1}
body[data-density="small"] .info{padding:5px}
body[data-density="small"] .name{font-size:.74rem}
body[data-density="small"] .pill{font-size:.61rem}
#empty{text-align:center;padding:50px 10px;color:#64727a}dialog{border:0;border-radius:15px;padding:0;width:min(720px,96vw);max-height:92vh;box-shadow:0 16px 65px #0005}dialog::backdrop{background:#18272d99}.modalHead{position:sticky;top:0;background:#fff;padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;z-index:1}.modalBody{padding:14px 17px 20px;overflow:auto;max-height:calc(92vh - 60px)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide{grid-column:1/-1}label{font-size:.82rem;font-weight:650}.field textarea{width:100%;resize:vertical}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.preview{width:100px;height:80px;object-fit:contain;background:#e7eceb;border-radius:8px}.stars button{border:0;font-size:1.65rem;padding:1px 3px;background:none;color:#a6b1b2}.stars button.on{color:#e2a52a}.foot{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px;border-top:1px solid #ddd;padding-top:12px}.notice{font-size:.8rem;color:#496875;min-height:1.3em}a{color:#256c76}#backup{display:none}
@media(max-width:1100px){#cards{grid-template-columns:repeat(4,minmax(0,1fr))}body[data-density="medium"] #cards{grid-template-columns:repeat(5,minmax(0,1fr))}body[data-density="small"] #cards{grid-template-columns:repeat(7,minmax(0,1fr))}}@media(max-width:700px){#cards,body[data-density="medium"] #cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}body[data-density="small"] #cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.fields{grid-template-columns:1fr}.field.wide{grid-column:1}.pic{aspect-ratio:1.1}header{position:relative}}@media(max-width:360px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1>🦀 レビュー在庫箱 <span class="muted">v1.1</span></h1>
<div class="bar"><button class="primary" id="add">🐵 JSONから登録</button><button id="addUrl">＋ URLだけ登録</button><label for="density" style="font-size:.8rem">表示</label><select id="density"><option value="large">大</option><option value="medium">中</option><option value="small">小</option></select><input id="search" placeholder="商品名・メモ・本文を検索"><select id="filter"><option value="">全状態</option><option>確認待ち</option><option>レビュー待ち</option><option>投稿待ち</option><option>保留</option><option>投稿済み</option><option>データなし</option></select><select id="sort"><option value="updated">更新が新しい順</option><option value="created">登録が新しい順</option><option value="old">登録が古い順</option><option value="title">商品名順</option></select><button id="export">JSON書出</button><button id="import">JSON読込</button><input type="file" id="backup" accept=".json,application/json"></div>
<div class="muted" id="count" style="margin-top:6px"></div></header><main><div id="cards"></div><div id="empty" hidden>まだカードがありません。まずは「＋ URL・JSON登録」からどうぞ 🐵🦀</div></main>
<dialog id="entryDialog"><div class="modalHead"><b>🐵🦀 新しいカードを登録</b><button class="close">閉じる ×</button></div><div class="modalBody"><p class="muted">猿のJSONを読み取ります。読み取れない場合はここへ貼り付けてください。登録前に商品名を確認できます。</p><textarea id="incoming" rows="8" style="width:100%" placeholder="https://... または { &quot;schema&quot;: ... }"></textarea><div id="incomingPreview" class="notice" style="margin-top:8px"></div><div class="row" style="margin-top:10px"><button class="primary" id="ingest">内容を確認して登録</button><span id="ingestMsg" class="notice"></span></div></div></dialog>
<dialog id="editDialog"><div class="modalHead"><b>📝 レビューカード</b><button class="close">閉じる ×</button></div><div class="modalBody"><div class="row" style="margin-bottom:12px"><img id="preview" class="preview" alt="商品画像"><span class="muted">画像がなくても登録・編集できます。</span></div>
<div class="fields">
<div class="field wide"><label for="title">商品名・作品名</label><input id="title"></div>
<div class="field wide"><label for="url">投稿先・商品URL</label><input id="url" type="url"></div>
<div class="field wide"><label for="imageUrl">画像URL（別サイトの画像でもOK）</label><input id="imageUrl"></div>
<div class="field"><label for="siteName">サイト名</label><input id="siteName"></div>
<div class="field"><label for="status">状態</label><select id="status"><option>確認待ち</option><option>レビュー待ち</option><option>投稿待ち</option><option>保留</option><option>投稿済み</option><option>データなし</option></select></div>
<div class="field"><label>評価</label><div class="stars" id="stars"></div></div>
<div class="field"><label for="photoStage">写真の状態</label><select id="photoStage"><option value="none">写真なし・未撮影</option><option value="somewhere">写真はある（未整理）</option><option value="ready">加工・保存済み（投稿準備OK）</option></select></div>
<div class="field"><label for="photoFilename">写真ファイル名（任意）</label><input id="photoFilename" placeholder="例：0042.jpg"></div>
<div class="field"><label for="destination">レビュー投稿先（手動選択）</label><select id="destination"><option value="">未選択</option><option>シェアビュー</option><option>DMM</option><option>FANZA</option><option>note</option><option>その他</option></select></div>
<div class="field wide"><label for="reviewTitle">レビューのタイトル</label><input id="reviewTitle"></div>
<div class="field wide"><label for="memo">短いメモ・保留理由</label><textarea id="memo" rows="3"></textarea></div>
<div class="field wide"><label for="body">レビュー本文</label><textarea id="body" rows="10"></textarea><span id="chars" class="muted"></span></div>
<div class="field wide"><label for="description">取得した商品説明（参考）</label><textarea id="description" rows="3"></textarea></div>
</div><div class="foot"><div class="row"><button id="openLink">元ページを開く ↗</button><button class="danger" id="remove">削除</button></div><div class="row"><span id="saveMsg" class="notice"></span><button class="primary" id="save">保存して閉じる</button></div></div></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), fields=['title','url','imageUrl','siteName','status','destination','photoStage','photoFilename','reviewTitle','memo','body','description'], statuses=['確認待ち','レビュー待ち','投稿待ち','保留','投稿済み','データなし'];
let db,items=[],active=null,rating=0,dirty=false,saveTimer=null;
function cleanUrl(raw){try{const u=new URL(raw.trim());if(!/^https?:$/.test(u.protocol))throw Error();['utm_source','utm_medium','utm_campaign','utm_term','utm_content','i3_ref','i3_ord','dmmref'].forEach(k=>u.searchParams.delete(k));return u.href}catch{return raw.trim()}}
function id(){return globalThis.crypto?.randomUUID?.()||('r-'+Date.now()+'-'+Math.random().toString(36).slice(2))}
function newItem(){const t=new Date().toISOString();return {id:id(),createdAt:t,updatedAt:t,title:'',url:'',imageUrl:'',siteName:'',description:'',status:'確認待ち',rating:0,photo:false,photoStage:'none',photoFilename:'',destination:'',reviewTitle:'',memo:'',body:''}}
function tx(mode='readonly'){return db.transaction('cards',mode).objectStore('cards')}
function all(){return new Promise((ok,no)=>{const r=tx().getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{const r=tx('readwrite').put(x);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function del(k){return new Promise((ok,no)=>{const r=tx('readwrite').delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
async function refresh(){items=await all();render()}
function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value,s=$('sort').value;let list=items.filter(x=>(!f||x.status===f)&&(!q||[x.title,x.memo,x.body,x.reviewTitle,x.siteName,x.destination,x.photoFilename].join(' ').toLowerCase().includes(q)));list.sort((a,b)=>s==='title'?(a.title||'').localeCompare(b.title||'','ja'):s==='old'?a.createdAt.localeCompare(b.createdAt):s==='created'?b.createdAt.localeCompare(a.createdAt):b.updatedAt.localeCompare(a.updatedAt));$('cards').replaceChildren();$('empty').hidden=list.length>0;$('count').textContent=`全 ${items.length} 件 / 表示 ${list.length} 件　｜　投稿待ち ${items.filter(x=>x.status==='投稿待ち').length} 件`;
for(const x of list){const card=document.createElement('article');card.className='card'+(statuses.slice(4).includes(x.status)?' closed':'');card.dataset.status=x.status;const pic=document.createElement('div');pic.className='pic';if(x.imageUrl&&/^https?:\/\//.test(x.imageUrl)){const img=document.createElement('img');img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';img.src=x.imageUrl;img.onerror=()=>{pic.textContent='🗂️'};pic.append(img)}else pic.textContent='🗂️';const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=x.title||x.url||'（未命名）';const meta=document.createElement('div');meta.className='meta';const badge=document.createElement('span');badge.className='pill';badge.textContent=x.status;meta.append(badge);if(x.rating){const a=document.createElement('span');a.className='muted';a.textContent='★'.repeat(x.rating);meta.append(a)}if((x.photoStage|| (x.photo?'ready':'none'))!=='ready'&&(x.destination==='シェアビュー'||(!x.destination&&/shareview/i.test(x.siteName+' '+x.url)))){const a=document.createElement('span');a.title='写真未準備';a.textContent='📷';meta.append(a)}if(x.destination){const dest=document.createElement('span');dest.className='pill';dest.textContent=x.destination;meta.append(dest)}info.append(name,meta);card.append(pic,info);card.onclick=()=>openEdit(x.id);$('cards').append(card)}}
function normalizeTitle(t,url){if(/shareview\.jp/.test(url)){const m=t.match(/みんなのレビュー[：:]\s*[「『](.*?)[」』]/);if(m)return m[1].trim()}return t}
function parseIncoming(text){const raw=text.trim();if(!raw)throw Error('URLかJSONを貼ってね');if(raw.startsWith('{')){const d=JSON.parse(raw);if(!d.url||!/^https?:\/\//.test(d.url))throw Error('有効なURLがありません');return {url:cleanUrl(d.url),title:normalizeTitle(String(d.title||''),d.url),description:String(d.description||''),imageUrl:String(d.imageUrl||''),siteName:String(d.siteName||'')}}if(!/^https?:\/\//.test(raw))throw Error('http(s)のURLを貼ってね');return {url:cleanUrl(raw)}}
function safeMerge(base,incoming){const x={...base};for(const k of ['title','description','imageUrl','siteName'])if(!x[k]&&incoming[k])x[k]=incoming[k];return x}
async function ingest(){try{const d=parseIncoming($('incoming').value);let x=items.find(x=>cleanUrl(x.url)===d.url);if(x){x=safeMerge(x,d);x.updatedAt=new Date().toISOString();await put(x);$('ingestMsg').textContent='既存カードの空欄だけ補完しました';}else{x={...newItem(),...d};await put(x);$('ingestMsg').textContent='新しいカードを登録しました'}await refresh();$('incoming').value='';setTimeout(()=>{$('entryDialog').close();openEdit(x.id)},300)}catch(e){$('ingestMsg').textContent='確認：'+e.message}}
function drawStars(){const root=$('stars');root.replaceChildren();for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent='★';b.className=n<=rating?'on':'';b.title=n+'つ星';b.onclick=()=>{rating=n;dirty=true;drawStars()};root.append(b)}}
function showPreview(){const im=$('preview'),u=$('imageUrl').value;im.style.visibility=u?'visible':'hidden';if(u&&/^https?:\/\//.test(u))im.src=u;else im.removeAttribute('src')}
function openEdit(key){active=key;const x=items.find(x=>x.id===key);if(!x)return;for(const k of fields)$(k).value=x[k]||'';$('photoStage').value=x.photoStage||(x.photo?'ready':'none');rating=Number(x.rating)||0;drawStars();showPreview();countChars();dirty=false;$('saveMsg').textContent='';$('editDialog').showModal()}
function countChars(){$('chars').textContent=`本文 ${[...$('body').value].length} 文字`}
function collect(){const x={...items.find(x=>x.id===active)};for(const k of fields)x[k]=$(k).value;x.url=cleanUrl(x.url);x.photo=x.photoStage==='ready';x.rating=rating;x.updatedAt=new Date().toISOString();return x}
async function save(close=true){if(!active)return;try{const x=collect();await put(x);dirty=false;$('saveMsg').textContent='保存しました';await refresh();if(close)$('editDialog').close()}catch(e){$('saveMsg').textContent='保存失敗：'+e.message}}
async function exportJson(){const data={schema:'review-stock/v1',exportedAt:new Date().toISOString(),cards:await all()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='review-stock-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importJson(file){try{const data=JSON.parse(await file.text());if(data.schema!=='review-stock/v1'||!Array.isArray(data.cards))throw Error('このツールのバックアップではありません');if(!confirm(`${data.cards.length}件のデータを読み込みます。既存の文章を守り、衝突時は既存カードを優先します。続けますか？`))return;let added=0,merged=0;for(const item of data.cards){if(!item||!item.id||!item.url)continue;const existing=items.find(x=>x.id===item.id)||items.find(x=>cleanUrl(x.url)===cleanUrl(item.url));if(existing){const mergedItem={...existing};for(const k of ['title','imageUrl','description','siteName','reviewTitle','memo','body','destination','photoFilename'])if(!mergedItem[k]&&item[k])mergedItem[k]=item[k];if(!mergedItem.photoStage&&item.photoStage)mergedItem.photoStage=item.photoStage;await put(mergedItem);merged++}else{await put({...newItem(),...item,id:item.id});added++}}await refresh();alert(`読込完了：新規 ${added} 件、既存の空欄補完 ${merged} 件。`)}catch(e){alert('読込できませんでした：'+e.message)}}
async function openImport(mode){$('incoming').value='';$('ingestMsg').textContent='';$('incomingPreview').textContent='';$('entryDialog').showModal();if(mode==='json'){try{const value=await navigator.clipboard.readText();const d=parseIncoming(value);if(!value.trim().startsWith('{'))throw Error('JSONではありません');$('incoming').value=value;$('incomingPreview').textContent='読み取り成功：'+(d.title||d.url)+' ／ '+(d.siteName||'');}catch(e){$('ingestMsg').textContent='自動読取できませんでした。猿のJSONを貼り付けてください（ブラウザの許可・HTTPS環境が必要な場合があります）。'}}else{$('incoming').placeholder='https://...';$('incomingPreview').textContent='URLのみ登録します';}}
$('add').onclick=()=>openImport('json');$('addUrl').onclick=()=>openImport('url');
$('incoming').oninput=()=>{try{const d=parseIncoming($('incoming').value);$('incomingPreview').textContent='登録対象：'+(d.title||d.url)}catch{$('incomingPreview').textContent=''}}; 
$('density').value=localStorage.getItem('review-stock-density')||'large';document.body.dataset.density=$('density').value;
$('density').onchange=()=>{document.body.dataset.density=$('density').value;localStorage.setItem('review-stock-density',$('density').value)};$('ingest').onclick=ingest;$('search').oninput=render;$('filter').onchange=render;$('sort').onchange=render;$('save').onclick=()=>save(true);$('export').onclick=exportJson;$('import').onclick=()=>$('backup').click();$('backup').onchange=async e=>{if(e.target.files[0])await importJson(e.target.files[0]);e.target.value=''};
$('remove').onclick=async()=>{if(!confirm('このカードを削除しますか？ この操作は元に戻せません。先にJSONバックアップを推奨します。'))return;await del(active);dirty=false;$('editDialog').close();await refresh()};
$('openLink').onclick=()=>{const u=$('url').value;if(/^https?:\/\//.test(u))window.open(u,'_blank','noopener,noreferrer');else alert('URLがありません')};
$('imageUrl').oninput=showPreview;$('body').oninput=countChars;
for(const el of document.querySelectorAll('#editDialog input,#editDialog select,#editDialog textarea'))el.addEventListener('input',()=>dirty=true);
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('editDialog').addEventListener('cancel',e=>{if(dirty&&!confirm('未保存の変更があります。閉じますか？'))e.preventDefault()});
$('editDialog').addEventListener('close',()=>{if(dirty&&active){ /* closeボタンによる破棄を明示 */ dirty=false;}});
$('editDialog').querySelector('.close').onclick=()=>{if(dirty&&!confirm('未保存の変更を破棄しますか？'))return;$('editDialog').close()};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const request=indexedDB.open('review-stock-v1',1);request.onupgradeneeded=()=>{request.result.createObjectStore('cards',{keyPath:'id'})};request.onsuccess=async()=>{db=request.result;await refresh()};request.onerror=()=>{alert('保存領域（IndexedDB）を開けませんでした。通常モードで開いてください。')};
})();
</script></body></html>
